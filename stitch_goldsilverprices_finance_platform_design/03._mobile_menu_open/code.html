<script>
        function toggleExpand(id, btn) {
            const content = document.getElementById(id);
            const icon = btn.querySelector('.material-symbols-outlined[data-icon="expand_more"]');
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
                btn.parentElement.classList.remove('bg-surface-container-low');
                btn.parentElement.classList.remove('border-surface-variant');
                btn.parentElement.classList.add('border-transparent');
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }
    </script>
