<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Add Transaction - GoldSilverPrices</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#273647",
                        "tertiary-fixed-dim": "#bbc7e1",
                        "surface-container": "#122131",
                        "on-background": "#d4e4fa",
                        "primary-fixed": "#dbe2fa",
                        "tertiary": "#bbc7e1",
                        "tertiary-container": "#061327",
                        "on-surface": "#d4e4fa",
                        "inverse-on-surface": "#233143",
                        "inverse-surface": "#d4e4fa",
                        "on-secondary-container": "#433300",
                        "on-surface-variant": "#c6c6cd",
                        "secondary": "#efc138",
                        "primary": "#bfc6de",
                        "surface-container-low": "#0d1c2d",
                        "surface": "#051424",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#767e93",
                        "primary-fixed-dim": "#bfc6de",
                        "on-secondary": "#3d2e00",
                        "on-secondary-fixed": "#241a00",
                        "on-primary-fixed": "#141b2d",
                        "on-tertiary-container": "#727e96",
                        "outline": "#909097",
                        "on-tertiary-fixed-variant": "#3b475d",
                        "on-tertiary-fixed": "#0f1c2f",
                        "on-tertiary": "#253145",
                        "surface-tint": "#bfc6de",
                        "on-primary": "#293043",
                        "surface-dim": "#051424",
                        "tertiary-fixed": "#d7e3fe",
                        "primary-container": "#0b1324",
                        "inverse-primary": "#575e72",
                        "on-secondary-fixed-variant": "#594400",
                        "secondary-container": "#c29800",
                        "secondary-fixed": "#ffdf91",
                        "background": "#051424",
                        "on-primary-fixed-variant": "#3f475a",
                        "surface-container-lowest": "#010f1f",
                        "surface-bright": "#2c3a4c",
                        "secondary-fixed-dim": "#efc138",
                        "error-container": "#93000a",
                        "outline-variant": "#45464c",
                        "error": "#ffb4ab",
                        "surface-container-high": "#1c2b3c",
                        "on-error": "#690005",
                        "surface-container-highest": "#273647"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "unit-md": "16px",
                        "margin-tablet": "24px",
                        "unit-sm": "8px",
                        "unit-xs": "4px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "unit-xl": "48px",
                        "unit-lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface-container-lowest');
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.surface-variant');
            border-radius: theme('borderRadius.full');
        }
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md">
<!-- Top App Bar (Modified for transactional "Close" context) -->
<header class="bg-surface-container flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-50">
<button aria-label="Close" class="text-on-surface-variant hover:text-secondary transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Add Transaction</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-unit-lg pb-32 overflow-y-auto">
<!-- Transaction Type Selector -->
<div class="bg-surface-container-high rounded-lg p-1 flex mb-unit-lg border border-outline-variant">
<button class="flex-1 py-3 text-center rounded-DEFAULT font-label-md text-label-md bg-secondary text-on-secondary shadow-sm transition-all">Buy</button>
<button class="flex-1 py-3 text-center rounded-DEFAULT font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all">Sell</button>
</div>
<!-- Asset Search Input -->
<div class="mb-unit-lg relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-xs" for="asset-search">Asset</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-on-surface-variant/50" id="asset-search" placeholder="Search gold, silver, stocks..." type="text">
</div>
<!-- Mock Autocomplete Dropdown (Hidden initially, shown for structure) -->
<div class="absolute w-full mt-1 bg-surface-container-high border border-outline-variant rounded-lg shadow-lg z-10 hidden">
<ul class="py-2">
<li class="px-4 py-3 hover:bg-surface-variant cursor-pointer flex justify-between items-center">
<span class="font-body-md">Physical Gold Ounce</span>
<span class="text-on-surface-variant font-label-md text-label-md">XAU</span>
</li>
<li class="px-4 py-3 hover:bg-surface-variant cursor-pointer flex justify-between items-center">
<span class="font-body-md">Silver Bar 10oz</span>
<span class="text-on-surface-variant font-label-md text-label-md">XAG</span>
</li>
</ul>
</div>
</div>
<!-- Numeric Inputs Layout -->
<div class="grid grid-cols-2 gap-unit-md mb-unit-lg">
<!-- Quantity -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-xs" for="quantity">Quantity</label>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3 px-4 text-on-surface font-body-md text-right focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" id="quantity" placeholder="0.00" type="number">
</div>
<!-- Price per Unit -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-xs" for="price">Price per Unit (USD)</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">$</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3 pl-8 pr-4 text-on-surface font-body-md text-right focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" id="price" placeholder="0.00" type="number">
</div>
</div>
</div>
<!-- Date Selector -->
<div class="mb-unit-lg">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-xs" for="date">Transaction Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="calendar_month">calendar_month</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all [color-scheme:dark]" id="date" type="date" value="2023-10-27">
</div>
</div>
<!-- Total Value Summary (Read-only) -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-4 flex justify-between items-center mb-unit-lg">
<span class="font-label-md text-label-md text-on-surface-variant">Total Value</span>
<span class="font-headline-md text-headline-md text-secondary">$0.00</span>
</div>
<!-- Optional Notes -->
<div class="mb-unit-lg">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit-xs" for="notes">Notes (Optional)</label>
<textarea class="w-full bg-surface-container border border-outline-variant rounded-lg py-3 px-4 text-on-surface font-body-md focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all resize-none placeholder:text-on-surface-variant/50" id="notes" placeholder="e.g., Bought from local dealer..." rows="3"></textarea>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-high border-t border-outline-variant p-4 pb-safe z-50">
<button class="w-full bg-secondary text-on-secondary font-headline-md text-body-md py-4 rounded-xl shadow-[0_4px_14px_0_rgba(239,193,56,0.39)] hover:brightness-110 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
            Save Transaction
            <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
</div>
<!-- Note: BottomNavBar and SideNavBar are suppressed because this is a transactional intent page -->
</body></html>
