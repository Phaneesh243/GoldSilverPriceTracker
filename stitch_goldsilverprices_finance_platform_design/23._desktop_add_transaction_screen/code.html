<!DOCTYPE html><html class="dark" lang="en"><head>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                    },

<style>
        body { background-color: #051424; color: #d4e4fa; }
        
        /* Form Field Base Styles */
        .input-field {
            background-color: #0b1324; /* Primary container */
            border: 1px solid #45464c; /* Outline variant */
            color: #d4e4fa;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            width: 100%;
            transition: all 0.2s ease-in-out;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #efc138; /* Secondary / Gold */
            box-shadow: 0 0 0 1px #efc138;
            background-color: #122131; /* Slightly lighter surface */
        }

        .input-field::placeholder {
            color: #767e93; /* On primary container */
        }
        
        .input-error {
            border-color: #ffb4ab;
            box-shadow: 0 0 0 1px #ffb4ab;
        }

        /* Toggle Button Group */
        .toggle-group {
            display: flex;
            background-color: #0b1324;
            border-radius: 0.5rem;
            border: 1px solid #45464c;
            overflow: hidden;
            padding: 4px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 0.5rem 1rem;
            text-align: center;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #c6c6cd;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
        
        .toggle-btn.active.buy {
            background-color: rgba(67, 160, 71, 0.2); /* Subtle green */
            color: #81c784;
        }

        .toggle-btn.active.sell {
            background-color: rgba(229, 57, 53, 0.2); /* Subtle red */
            color: #e57373;
        }

        /* Submit Button */
        .btn-primary {
            background-color: #efc138;
            color: #3d2e00;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            display: inline-block;
        }
        
        .btn-primary:hover {
            background-color: #ffdf91;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 193, 56, 0.2);
        }
        
        /* Modal Backdrop Overlay */
        .modal-overlay {
            background: rgba(5, 20, 36, 0.8);
            backdrop-filter: blur(8px);
        }

    </style>
</head>
<body class="font-body-md antialiased min-h-screen flex items-center justify-center p-4 lg:p-margin-desktop">
<!-- App Shell structure implicitly hidden as per intent instruction for transactional/focused tasks -->
<!-- Transaction Modal / Centered Card Layout -->
<div class="relative w-full max-w-2xl bg-surface-container-high rounded-xl border border-outline-variant shadow-2xl overflow-hidden z-10 flex flex-col">
<!-- Header -->
<div class="flex justify-between items-center p-6 border-b border-outline-variant bg-surface-container">
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Add Transaction</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Log a new asset purchase or sale.</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Form Content -->
<div class="p-6 md:p-8 flex-1 overflow-y-auto">
<form action="#" class="space-y-6" method="POST">
<!-- Buy/Sell Toggle -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider">Transaction Type</label>
<div class="toggle-group">
<div class="toggle-btn active buy">Buy</div>
<div class="toggle-btn sell">Sell</div>
</div>
</div>
<!-- Asset Search -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider" for="asset-search">Asset Symbol <span class="text-error">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">search</span>
</div>
<input class="input-field pl-10" id="asset-search" placeholder="e.g. XAU, AAPL, BTC" required="" type="text">
<!-- Simulated Dropdown Indicator -->
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">expand_more</span>
</div>
</div>
<p class="mt-1 font-body-sm text-body-sm text-on-primary-container">Search by ticker symbol or full name.</p>
</div>
<!-- Quantity and Price Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider" for="quantity">Quantity <span class="text-error">*</span></label>
<input class="input-field text-right" id="quantity" placeholder="0.00" required="" step="any" type="number">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider" for="price">Price per Unit (USD) <span class="text-error">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">$</div>
<input class="input-field pl-8 text-right" id="price" placeholder="0.00" required="" step="0.01" type="number">
</div>
</div>
</div>
<!-- Date and Fees Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider" for="date">Transaction Date <span class="text-error">*</span></label>
<div class="relative">
<input class="input-field pl-10 appearance-none" id="date" required="" type="date">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">calendar_today</span>
</div>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider" for="fees">Fees / Commission (USD)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">$</div>
<input class="input-field pl-8 text-right" id="fees" placeholder="0.00" step="0.01" type="number">
</div>
</div>
</div>
<!-- Notes (Optional) -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 uppercase tracking-wider" for="notes">Notes (Optional)</label>
<textarea class="input-field min-h-[80px] resize-y" id="notes" placeholder="Add any details about this transaction..."></textarea>
</div>
</form>
</div>
<!-- Footer / Summary Section -->
<div class="bg-surface-container p-6 md:p-8 border-t border-outline-variant flex flex-col md:flex-row items-center justify-between gap-6">
<!-- Summary Info -->
<div class="w-full md:w-auto">
<p class="font-body-sm text-body-sm text-on-surface-variant">Estimated Total</p>
<div class="font-headline-lg text-headline-lg text-secondary flex items-baseline gap-1">
<span class="text-headline-md text-on-surface-variant font-normal">$</span> 0.00
                </div>
<p class="font-label-md text-label-md text-on-primary-container mt-1">Includes specified fees</p>
</div>
<!-- Action Buttons -->
<div class="w-full md:w-auto flex flex-col sm:flex-row gap-4">
<button class="px-6 py-3 rounded-lg font-body-md font-semibold text-on-surface bg-surface-variant hover:bg-surface-bright transition-colors text-center w-full sm:w-auto" type="button">
                    Cancel
                </button>
<button class="btn-primary w-full sm:w-auto flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" style="font-size: 20px;">save</span>
                    Save Transaction
                </button>
</div>
</div>
</div>
<!-- Decorative background glow behind modal -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-secondary/5 rounded-full blur-[100px] pointer-events-none z-0"></div>
<script>
        // Simple toggle logic for visual demonstration
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Simple calculation logic for total
        const quantityInput = document.getElementById('quantity');
        const priceInput = document.getElementById('price');
        const feesInput = document.getElementById('fees');
        const totalDisplay = document.querySelector('.text-headline-lg.text-secondary');

        function updateTotal() {
            const qty = parseFloat(quantityInput.value) || 0;
            const price = parseFloat(priceInput.value) || 0;
            const fees = parseFloat(feesInput.value) || 0;
            
            const total = (qty * price) + fees;
            
            totalDisplay.innerHTML = `<span class="text-headline-md text-on-surface-variant font-normal">$</span> ${total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        quantityInput.addEventListener('input', updateTotal);
        priceInput.addEventListener('input', updateTotal);
        feesInput.addEventListener('input', updateTotal);

        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();
    </script>
</body></html>
